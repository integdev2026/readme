name: Smoke check live site

# Requests key pages on the live site (www.integpro.com.au) and prints status codes.
on:
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/smoke-check.yml'
      - 'site/**'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy to Wix Headless']
    types: [completed]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Request pages
        run: |
          sleep 180 # give the deploy workflow time to release
          BASE=https://www.integpro.com.au
          for p in / /disp /about-us-iso-team /services /iso-service-australia /iso-9001-compliance-certification-sydney /iso-14001-compliance-certification /iso-45001-occupational-health-safety /iso-27001-information-security-management-system /iso-13485-medical-devices-quality-management-system /free-consultation /thank-you /privacy-policy /blog /post/what-is-iso /images/logo.webp /robots.txt /sitemap-posts.xml; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' -L "$BASE$p")
            title=$(grep -o '<title>[^<]*' /tmp/body | head -1 | sed 's/<title>//')
            echo "$code $p :: $title"
            case "$code" in 2*) ;; *) fail=1 ;; esac
          done
          # Google Ads relies on the GA4 tag on every page.
          curl -s "$BASE/" | grep -q 'G-8HG19XQE77' && echo "GA4 tag present" || { echo "::error::GA4 tag missing on home page"; fail=1; }
          # The domain without www must permanently redirect to www.
          for u in https://integpro.com.au/ http://integpro.com.au/ http://www.integpro.com.au/; do
            read code loc < <(curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' "$u" || echo "000 ") || true
            echo "$code $u -> $loc"
            case "$code $loc" in 301\ https://www.integpro.com.au/*|308\ https://www.integpro.com.au/*) ;; *) echo "::error::$u should 301 to https://www.integpro.com.au/"; fail=1 ;; esac
          done
          exit ${fail:-0}

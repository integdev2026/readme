name: Smoke check preview

# Requests key pages on the Wix preview and prints status codes.
on:
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/smoke-check.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy to Wix Headless']
    types: [completed]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Request pages
        run: |
          BASE=https://headless-kyphopvoogn-mehrdadpermeh-140d.wix-site-host.com
          for p in / /disp.html /about-us-iso-team.html /iso-disp-services.html /iso-9001-compliance-certification-sydney.html /medical-iso.html /free-consultation.html /privacy-policy.html /blog.html /blog/page/2.html /blog/categories/disp-compliance.html /post/what-is-iso.html /images/logo.png; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' -L "$BASE$p")
            title=$(grep -o '<title>[^<]*' /tmp/body | head -1 | sed 's/<title>//')
            echo "$code $p :: $title"
          done

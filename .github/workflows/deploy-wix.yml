name: Deploy to Wix Headless

# Builds the Astro site and releases it to the Wix-managed headless site
# configured in site/wix.config.json. Needs the WIX_API_KEY repository secret.
# Only main deploys: a push to a feature branch must not replace the live site
# (that is how the GA4 tracking was lost before). Merge a pull request to release.
on:
  push:
    branches: ['main']
    paths:
      - 'site/**'
      - '.github/workflows/deploy-wix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-wix
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The WIX_API_KEY secret lives only in the 'production' environment, which
    # GitHub restricts to the main branch. Any other branch cannot get the key,
    # even if it carries an old copy of this workflow.
    environment: production
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse anything but the latest main
        working-directory: .
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Deploys run only from main (got $GITHUB_REF)."; exit 1
          fi
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_SHA is not the latest main; a newer commit will deploy instead."; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Check Wix API key
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          if [ -z "$WIX_API_KEY" ]; then
            echo "::error::WIX_API_KEY repository secret is missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Log in to Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: npx wix login --api-key "$WIX_API_KEY"

      - name: Pull Wix environment
        run: npx wix env pull

      - name: Build
        run: npx wix build

      - name: Release
        run: npx wix release
